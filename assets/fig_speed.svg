<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Speed — surrogate vs. the CFD it learns from"><rect width="860" height="320" fill="#FFFFFF"/><text x="26" y="34" font-size="20" font-weight="700" fill="#0F172A">Speed — surrogate vs. the CFD it learns from</text><text x="26" y="57" font-size="13.5" fill="#64748B">Per-case wall-clock (log scale). Surrogate inference is a sub-second estimate; CFD times are measured.</text><text x="834" y="57" font-size="12" fill="#64748B" text-anchor="end">≈ 1,000–4,000× faster than CFD</text><line x1="250.0" y1="88" x2="250.0" y2="272" stroke="#E2E8F0" stroke-width="1"/><text x="250.0" y="292" font-size="11" fill="#64748B" text-anchor="middle">0.1 s</text><line x1="342.0" y1="88" x2="342.0" y2="272" stroke="#E2E8F0" stroke-width="1"/><text x="342.0" y="292" font-size="11" fill="#64748B" text-anchor="middle">1 s</text><line x1="434.0" y1="88" x2="434.0" y2="272" stroke="#E2E8F0" stroke-width="1"/><text x="434.0" y="292" font-size="11" fill="#64748B" text-anchor="middle">10 s</text><line x1="526.0" y1="88" x2="526.0" y2="272" stroke="#E2E8F0" stroke-width="1"/><text x="526.0" y="292" font-size="11" fill="#64748B" text-anchor="middle">100 s</text><line x1="618.0" y1="88" x2="618.0" y2="272" stroke="#E2E8F0" stroke-width="1"/><text x="618.0" y="292" font-size="11" fill="#64748B" text-anchor="middle">1000 s</text><line x1="710.0" y1="88" x2="710.0" y2="272" stroke="#E2E8F0" stroke-width="1"/><text x="710.0" y="292" font-size="11" fill="#64748B" text-anchor="middle">10⁴ s</text><text x="234" y="116.0" font-size="13.5" fill="#0F172A" text-anchor="end">OpenFOAM CFD — high fin count</text><rect x="250" y="98.0" width="445.9" height="26" rx="5" fill="#64748B"/><text x="705.9" y="116.0" font-size="13" font-weight="700" fill="#0F172A">≈ 117 min</text><text x="234" y="162.0" font-size="13.5" fill="#0F172A" text-anchor="end">OpenFOAM CFD — median (601 cases)</text><rect x="250" y="144.0" width="379.1" height="26" rx="5" fill="#64748B"/><text x="639.1" y="162.0" font-size="13" font-weight="700" fill="#0F172A">≈ 22 min</text><text x="234" y="208.0" font-size="13.5" fill="#0F172A" text-anchor="end">OpenFOAM CFD — low fin count</text><rect x="250" y="190.0" width="295.3" height="26" rx="5" fill="#64748B"/><text x="555.3" y="208.0" font-size="13" font-weight="700" fill="#0F172A">≈ 2.7 min</text><text x="234" y="254.0" font-size="13.5" fill="#0F172A" text-anchor="end">Kuber surrogate (inference)</text><rect x="250" y="236.0" width="43.9" height="26" rx="5" fill="#EA580C"/><text x="303.9" y="254.0" font-size="13" font-weight="700" fill="#0F172A">≈ 0.3 s  →  ~1,000–4,000× faster</text></svg>