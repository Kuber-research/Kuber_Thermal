<svg xmlns="http://www.w3.org/2000/svg" width="884" height="320" viewBox="0 0 884 320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Speed — surrogate vs. the CFD it learns from"><rect width="884" height="320" fill="#FFFFFF"/><text x="26" y="34" font-size="20" font-weight="700" fill="#14181F">Speed — surrogate vs. the CFD it learns from</text><text x="26" y="57" font-size="13.5" fill="#5B6672">Per-case wall-clock (log scale). Surrogate inference is a sub-second estimate; CFD times are measured.</text><text x="858" y="57" font-size="12" fill="#5B6672" text-anchor="end">≈ 1,000–4,000× faster than CFD</text><line x1="278.0" y1="88" x2="278.0" y2="272" stroke="#E6EAEF" stroke-width="1"/><text x="278.0" y="292" font-size="11" fill="#5B6672" text-anchor="middle">0.1 s</text><line x1="369.2" y1="88" x2="369.2" y2="272" stroke="#E6EAEF" stroke-width="1"/><text x="369.2" y="292" font-size="11" fill="#5B6672" text-anchor="middle">1 s</text><line x1="460.4" y1="88" x2="460.4" y2="272" stroke="#E6EAEF" stroke-width="1"/><text x="460.4" y="292" font-size="11" fill="#5B6672" text-anchor="middle">10 s</text><line x1="551.6" y1="88" x2="551.6" y2="272" stroke="#E6EAEF" stroke-width="1"/><text x="551.6" y="292" font-size="11" fill="#5B6672" text-anchor="middle">100 s</text><line x1="642.8" y1="88" x2="642.8" y2="272" stroke="#E6EAEF" stroke-width="1"/><text x="642.8" y="292" font-size="11" fill="#5B6672" text-anchor="middle">1000 s</text><line x1="734.0" y1="88" x2="734.0" y2="272" stroke="#E6EAEF" stroke-width="1"/><text x="734.0" y="292" font-size="11" fill="#5B6672" text-anchor="middle">10⁴ s</text><text x="262" y="116.0" font-size="13.5" fill="#14181F" text-anchor="end">OpenFOAM CFD — high fin count</text><rect x="278" y="98.0" width="442.0" height="26" rx="5" fill="#AEB8C2"/><text x="730.0" y="116.0" font-size="13" font-weight="700" fill="#14181F">≈ 117 min</text><text x="262" y="162.0" font-size="13.5" fill="#14181F" text-anchor="end">OpenFOAM CFD — median (601 cases)</text><rect x="278" y="144.0" width="375.8" height="26" rx="5" fill="#AEB8C2"/><text x="663.8" y="162.0" font-size="13" font-weight="700" fill="#14181F">≈ 22 min</text><text x="262" y="208.0" font-size="13.5" fill="#14181F" text-anchor="end">OpenFOAM CFD — low fin count</text><rect x="278" y="190.0" width="292.7" height="26" rx="5" fill="#AEB8C2"/><text x="580.7" y="208.0" font-size="13" font-weight="700" fill="#14181F">≈ 2.7 min</text><text x="262" y="254.0" font-size="13.5" fill="#14181F" text-anchor="end">Kuber surrogate (inference)</text><rect x="278" y="236.0" width="43.5" height="26" rx="5" fill="#1F4E79"/><text x="331.5" y="254.0" font-size="13" font-weight="700" fill="#14181F">≈ 0.3 s  →  ~1,000–4,000× faster</text></svg>