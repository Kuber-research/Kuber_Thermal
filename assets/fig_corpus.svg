<svg xmlns="http://www.w3.org/2000/svg" width="860" height="324" viewBox="0 0 860 324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The Kuber corpus at a glance"><rect width="860" height="324" fill="#FFFFFF"/><text x="26" y="34" font-size="20" font-weight="700" fill="#0F172A">The Kuber corpus at a glance</text><text x="26" y="57" font-size="13.5" fill="#64748B">Self-generated OpenFOAM CHT data — 0 cases from SIMSHIFT or any licensed source.</text><rect x="26" y="92" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="44" y="138" font-size="26" font-weight="800" fill="#EA580C">4</text><text x="44" y="162" font-size="12.5" fill="#64748B">fluids — air / water / oil / glycol</text><rect x="236" y="92" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="254" y="138" font-size="26" font-weight="800" fill="#EA580C">2</text><text x="254" y="162" font-size="12.5" fill="#64748B">regimes — natural + forced</text><rect x="446" y="92" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="464" y="138" font-size="26" font-weight="800" fill="#EA580C">4+</text><text x="464" y="162" font-size="12.5" fill="#64748B">shapes — fins / plate / cube / pin-fin</text><rect x="656" y="92" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="674" y="138" font-size="26" font-weight="800" fill="#EA580C">2</text><text x="674" y="162" font-size="12.5" fill="#64748B">device classes — heatsink + cold plate</text><rect x="26" y="198" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="44" y="244" font-size="26" font-weight="800" fill="#EA580C">1.4 M</text><text x="44" y="268" font-size="12.5" fill="#64748B">cells per CFD case</text><rect x="236" y="198" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="254" y="244" font-size="26" font-weight="800" fill="#EA580C">16,384</text><text x="254" y="268" font-size="12.5" fill="#64748B">nodes sampled per case</text><rect x="446" y="198" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="464" y="244" font-size="26" font-weight="800" fill="#EA580C">5</text><text x="464" y="268" font-size="12.5" fill="#64748B">predicted field channels (U,T,p)</text><rect x="656" y="198" width="196" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="674" y="244" font-size="26" font-weight="800" fill="#EA580C">0.1 K</text><text x="674" y="268" font-size="12.5" fill="#64748B">mesh-convergence tolerance</text></svg>